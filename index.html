    <script>
      // Apply the saved (or preferred) color theme before first paint to
      // avoid a dark/light flash. Mirrors src/hooks/useTheme.js.
      (function () {
        try {
          var t = localStorage.getItem("kamran-portfolio-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (t === "light") document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* storage unavailable — default dark theme applies */
        }
      })();
    </script>
    <script>
      // Restore the route saved by 404.html when GitHub Pages serves this
      // file for a deep link (e.g. /portfolio/projects). Runs before the
      // router starts so BrowserRouter picks up the correct path.
      (function () {
        try {
          var redirect = sessionStorage.getItem("spa-redirect");
          sessionStorage.removeItem("spa-redirect");
          if (
            redirect &&
            redirect.charAt(0) === "/" &&
            redirect !== location.pathname + location.search + location.hash
          ) {
            history.replaceState(null, "", redirect);
          }
        } catch (e) {
          /* storage unavailable — load the app root */
        }
      })();
    </script>
