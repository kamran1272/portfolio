<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KickZone - Create Account</title>
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="build/assets/app-BTfBdD0h.css" rel="stylesheet">
<style>
body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px 0; }
.register-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; max-width: 900px; width: 95%; display: flex; }
.register-left { background: linear-gradient(135deg, #0f3460, #1a1a2e); color: #fff; padding: 48px 40px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.register-right { padding: 48px 40px; flex: 1; }
.register-left h2 { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
.register-left p { opacity: .85; line-height: 1.6; }
.feature-list { list-style: none; padding: 0; margin-top: 24px; }
.feature-list li { padding: 8px 0; opacity: .9; }
.feature-list li::before { content: "✓ "; color: #4ade80; font-weight: bold; }
.form-control { border-radius: 8px; padding: 12px 16px; border: 1px solid #e2e8f0; }
.form-control:focus { border-color: #0f3460; box-shadow: 0 0 0 3px rgba(15,52,96,.1); }
.btn-register { background: linear-gradient(135deg, #0f3460, #1a1a2e); border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; color: #fff; }
.btn-register:hover { opacity: .92; color: #fff; }
.logo-img { width: 64px; height: 64px; border-radius: 12px; margin-bottom: 20px; }
@media (max-width: 768px) { .register-left { display: none; } }
</style>
</head>
<body>
<div class="register-card">
  <div class="register-left">
    <img src="images/logo1.png" alt="KickZone" class="logo-img">
    <h2>Join KickZone</h2>
    <p>Create your account to manage teams, players, fixtures, and events.</p>
    <ul class="feature-list">
      <li>Free to get started</li>
      <li>Manage unlimited teams</li>
      <li>Schedule fixtures easily</li>
      <li>Track player performance</li>
    </ul>
  </div>
  <div class="register-right">
    <h3 class="fw-bold mb-2">Create account</h3>
    <p class="text-muted mb-4">Sign up for your KickZone account</p>
    <form id="demo-register-form">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full name</label>
        <input type="text" name="name" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Choose a password" required minlength="6">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm password</label>
        <input type="password" name="password_confirmation" class="form-control" placeholder="Confirm your password" required>
      </div>
      <button type="submit" class="btn btn-register">Create Account</button>
      <div class="text-center mt-4">
        <small class="text-muted">Already have an account? <a href="login.html" class="text-decoration-none fw-semibold">Sign in</a></small>
      </div>
    </form>
    <div class="text-center mt-4">
      <a href="index.html" class="text-decoration-none">← Back to homepage</a>
    </div>
  </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="demo.js?v=2"></script>
</body>
</html>
