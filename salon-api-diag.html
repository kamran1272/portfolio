<!doctype html>
<html><head><meta charset="utf-8"><title>Salon API diag</title>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
</head>
<body><pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  const API = 'https://laravel-react-salon-booking-production.up.railway.app';
  log('origin: ' + location.origin);
  log('axios loaded: ' + (typeof axios !== 'undefined'));
  // Exact replica of the demo app's client
  const client = axios.create({
    baseURL: API + '/api',
    headers: { Accept: 'application/json' },
  });
  const token = localStorage.getItem('salon_token');
  log('stored salon_token: ' + (token ? token.slice(0, 12) + '...' : '(none)'));
  client.interceptors.request.use((config) => {
    const t = localStorage.getItem('salon_token');
    if (t) config.headers.Authorization = 'Bearer ' + t;
    return config;
  });
  try {
    const res = await client.post('/auth/login', { email: 'admin@demo.io', password: 'password' });
    log('AXIOS login => ' + res.status + ' user=' + (res.data.user && res.data.user.email));
  } catch (err) {
    log('AXIOS login FAIL: status=' + (err.response && err.response.status) +
        ' msg=' + ((err.response && err.response.data && err.response.data.message) || '(no response/message)') +
        ' err=' + err.message);
  }
  log('done');
})();
</script></body></html>
