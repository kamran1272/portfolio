<!doctype html>
<html><head><meta charset="utf-8"><title>Salon API diag</title></head>
<body><pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  const API = 'https://laravel-react-salon-booking-production.up.railway.app';
  log('origin: ' + location.origin);
  // A: simple POST, NO preflight (text/plain is CORS-safelisted)
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ email: 'admin@demo.io', password: 'password' })
    });
    const t = await r.text();
    log('A plain-POST (no preflight) => ' + r.status + ' body=' + t.slice(0, 200));
  } catch (e) { log('A plain-POST FAIL: ' + e.name + ' :: ' + String(e.message).slice(0,150)); }
  // B: JSON POST, needs CORS preflight (exactly what the app does)
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: 'admin@demo.io', password: 'password' })
    });
    const t = await r.text();
    log('B json-POST (preflight) => ' + r.status + ' body=' + t.slice(0, 200));
  } catch (e) { log('B json-POST FAIL: ' + e.name + ' :: ' + String(e.message).slice(0,150)); }
  log('done');
})();
</script></body></html>
