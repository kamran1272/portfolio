<!doctype html>
<html><head><meta charset="utf-8"><title>Salon API diag</title></head>
<body><pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  const API = 'https://laravel-react-salon-booking-production.up.railway.app';
  log('origin: ' + location.origin);
  // 1. simple GET
  try {
    const r = await fetch(API + '/api/services', { headers: { 'Accept': 'application/json' } });
    const t = await r.text();
    log('GET /api/services => ' + r.status + ' len=' + t.length);
  } catch (e) { log('GET /api/services FAIL: ' + e.name + ' :: ' + String(e.message).slice(0,200)); }
  // 2. preflight + POST login (exactly what the app does)
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: 'admin@demo.io', password: 'password' })
    });
    const t = await r.text();
    log('POST /api/auth/login => ' + r.status + ' body=' + t.slice(0, 300));
  } catch (e) { log('POST /api/auth/login FAIL: ' + e.name + ' :: ' + String(e.message).slice(0,200)); }
  // 3. explicit OPTIONS preflight visibility via a no-cors probe is not possible; report done
  log('done');
})();
</script></body></html>
